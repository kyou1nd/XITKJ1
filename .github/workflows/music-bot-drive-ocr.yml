name: Music Bot - Google Drive PNG Request

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  music-request-bot:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ==========================================
      # 3. INSTALL OCR
      # ==========================================
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

          python -m pip install --upgrade pip

          pip install \
            gdown \
            pillow \
            pytesseract

      # ==========================================
      # 4. PREPARE FOLDER
      # ==========================================
      - name: Prepare request folder
        run: |
          rm -rf drive_music_requests
          mkdir -p drive_music_requests

          echo "Folder request dibuat."

      # ==========================================
      # 5. DOWNLOAD GOOGLE DRIVE
      # ==========================================
      - name: Download PNG requests from Google Drive
        env:
          DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1oO4PNM4-kQpB4UVk-kWSz7mLC0XaTfko
        run: |
          echo "=========================================="
          echo " GOOGLE DRIVE MUSIC REQUEST"
          echo "=========================================="

          echo ""
          echo "Folder:"
          echo "$DRIVE_FOLDER_URL"

          echo ""
          echo "Mulai download..."

          gdown \
            --folder "$DRIVE_FOLDER_URL" \
            --output drive_music_requests \
            --remaining-ok

          echo ""
          echo "=========================================="
          echo " SEMUA FILE YANG TERDOWNLOAD"
          echo "=========================================="

          find drive_music_requests \
            -type f \
            -print || true

          echo ""
          echo "=========================================="
          echo " FILE PNG YANG DITEMUKAN"
          echo "=========================================="

          PNG_COUNT=$(find drive_music_requests \
            -type f \
            -iname "*.png" \
            | wc -l)

          echo "Jumlah PNG: $PNG_COUNT"

          if [ "$PNG_COUNT" -eq 0 ]; then
            echo ""
            echo "Tidak ada PNG request yang ditemukan."
            echo "Periksa izin folder Google Drive."
          else
            echo ""
            echo "PNG ditemukan:"
            find drive_music_requests \
              -type f \
              -iname "*.png" \
              -print
          fi

      # ==========================================
      # 6. OCR + YOUTUBE API
      # ==========================================
      - name: Read PNG with OCR and update music list
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "=========================================="
          echo " MUSIC DRIVE OCR BOT"
          echo "=========================================="

          python tools/music_drive_bot.py

      # ==========================================
      # 7. CHECK RESULT
      # ==========================================
      - name: Check generated files
        run: |
          echo "=========================================="
          echo " HASIL"
          echo "=========================================="

          echo ""
          echo "music-list.js:"
          ls -lh music-list.js || true

          echo ""
          echo ".musicbot:"
          ls -lah .musicbot || true

          echo ""
          echo "Git status:"
          git status --short

      # ==========================================
      # 8. COMMIT + PUSH
      # ==========================================
      - name: Commit automatic playlist changes
        run: |
          echo "=========================================="
          echo " COMMIT AUTOMATIC PLAYLIST"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pastikan folder state tersedia
          mkdir -p .musicbot

          # Kalau belum ada, buat processed.json
          if [ ! -f ".musicbot/processed.json" ]; then
            echo "[]" > .musicbot/processed.json
          fi

          echo ""
          echo "Menambahkan music-list.js..."
          git add music-list.js

          echo "Menambahkan processed.json..."
          git add -f .musicbot/processed.json

          echo ""
          echo "Perubahan yang akan di-commit:"
          git status --short

          # Kalau tidak ada perubahan
          if git diff --cached --quiet; then
            echo ""
            echo "Tidak ada perubahan."
            exit 0
          fi

          echo ""
          echo "Membuat commit..."

          git commit \
            -m "Auto add requested music from Drive"

          echo ""
          echo "Push ke GitHub..."

          git push

          echo ""
          echo "=========================================="
          echo " BERHASIL"
          echo "=========================================="
