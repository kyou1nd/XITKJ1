name: Music Bot

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Judul lagu yang ingin dicari"
        required: true
        type: string

permissions:
  contents: write

jobs:
  music-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cari lagu dan simpan ke playlist
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_key = os.environ["YOUTUBE_API_KEY"]
          query = os.environ["QUERY"].strip()

          if not query:
              raise SystemExit("Judul lagu kosong.")

          params = urllib.parse.urlencode({
              "part": "snippet",
              "q": query,
              "type": "video",
              "maxResults": 1,
              "key": api_key
          })

          url = "https://www.googleapis.com/youtube/v3/search?" + params

          try:
              with urllib.request.urlopen(url) as response:
                  data = json.load(response)
          except Exception as e:
              raise SystemExit(f"Gagal mengakses YouTube API: {e}")

          items = data.get("items", [])

          if not items:
              raise SystemExit(f"Lagu tidak ditemukan: {query}")

          item = items[0]

          video_id = item["id"]["videoId"]
          title = item["snippet"]["title"]
          channel = item["snippet"]["channelTitle"]
          thumbnail = item["snippet"]["thumbnails"]["high"]["url"]

          playlist = Path("music-list.js")

          if not playlist.exists():
              raise SystemExit("File music-list.js tidak ditemukan.")

          text = playlist.read_text(encoding="utf-8")

          marker = "window.LOCAL_MUSIC = ["

          if marker not in text:
              raise SystemExit(
                  "Format music-list.js tidak sesuai."
              )

          # Cek apakah video sudah ada
          if video_id in text:
              print("Lagu ini sudah ada di playlist.")
              raise SystemExit(0)

          # Buat object lagu baru
          new_song = {
              "name": title,
              "artist": channel,
              "src": f"https://www.youtube.com/watch?v={video_id}",
              "cover": thumbnail,
              "type": "youtube",
              "youtubeId": video_id
          }

          song_text = json.dumps(
              new_song,
              ensure_ascii=False,
              indent=2
          )

          # Cari penutup array LOCAL_MUSIC
          end = text.rfind("];")

          if end == -1:
              raise SystemExit(
                  "Penutup array LOCAL_MUSIC tidak ditemukan."
              )

          # Tambahkan koma jika sudah ada lagu
          before = text[:end].rstrip()

          if before.endswith("}"):
              addition = ",\n  " + song_text.replace("\n", "\n  ")
          else:
              addition = "\n  " + song_text.replace("\n", "\n  ")

          text = before + addition + "\n" + text[end:]

          playlist.write_text(
              text,
              encoding="utf-8"
          )

          print("================================")
          print("LAGU BERHASIL DITAMBAHKAN")
          print("================================")
          print(f"Judul   : {title}")
          print(f"Channel : {channel}")
          print(f"Video ID: {video_id}")
          print("================================")
          PY

      - name: Commit playlist ke GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add music-list.js

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Add requested YouTube song"
          git push
