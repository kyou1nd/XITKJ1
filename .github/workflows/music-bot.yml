name: Music Bot

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Judul lagu yang ingin dicari"
        required: true
        type: string

permissions:
  contents: write

jobs:
  music-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cari lagu YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          api_key = os.environ["YOUTUBE_API_KEY"]
          query = os.environ["QUERY"].strip()

          params = urllib.parse.urlencode({
              "part": "snippet",
              "q": query,
              "type": "video",
              "maxResults": 1,
              "key": api_key
          })

          url = "https://www.googleapis.com/youtube/v3/search?" + params

          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          items = data.get("items", [])

          if not items:
              raise SystemExit("Lagu tidak ditemukan.")

          item = items[0]

          video_id = item["id"]["videoId"]
          title = item["snippet"]["title"]
          channel = item["snippet"]["channelTitle"]
          thumbnail = item["snippet"]["thumbnails"]["high"]["url"]

          print("================================")
          print("LAGU DITEMUKAN")
          print("================================")
          print(f"Judul   : {title}")
          print(f"Channel : {channel}")
          print(f"Video ID: {video_id}")
          print("================================")

          file = Path("music-list.js")

          if not file.exists():
              raise SystemExit("music-list.js tidak ditemukan.")

          text = file.read_text(encoding="utf-8")

          if video_id in text:
              print("Lagu sudah ada di playlist.")
              raise SystemExit(0)

          new_song = f'''  {{
            name: {json.dumps(title, ensure_ascii=False)},
            artist: {json.dumps(channel, ensure_ascii=False)},
            src: "https://www.youtube.com/watch?v={video_id}",
            cover: "https://i.ytimg.com/vi/{video_id}/hqdefault.jpg",
            type: "youtube",
            youtubeId: "{video_id}"
          }}'''

          marker = "window.LOCAL_MUSIC = ["

          if marker not in text:
              raise SystemExit("window.LOCAL_MUSIC tidak ditemukan.")

          end = text.rfind("];")

          if end == -1:
              raise SystemExit("Penutup playlist tidak ditemukan.")

          before = text[:end].rstrip()

          if before.endswith("}"):
              before += ","

          text = before + "\n" + new_song + "\n" + text[end:]

          file.write_text(text, encoding="utf-8")

          print("================================")
          print("PLAYLIST BERHASIL DIUPDATE")
          print("================================")

          PY

      - name: Cek perubahan
        run: |
          echo "Isi music-list.js:"
          cat music-list.js

          echo ""
          echo "Perubahan Git:"
          git diff -- music-list.js

      - name: Commit dan Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add music-list.js

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          git commit -m "Add requested song"
          git push

          echo "================================"
          echo "PLAYLIST BERHASIL DIKIRIM KE GITHUB"
          echo "================================"
